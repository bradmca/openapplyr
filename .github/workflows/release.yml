name: Release

# Builds the installers for a version tag on each platform, then creates one draft release with all of
# them for a maintainer to review and publish. Builds are not code-signed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (for example v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # macOS: the fuses change the binary, so it gets an ad-hoc signature (required to launch on Apple silicon).
      - run: npx electron-builder --publish never -c.mac.identity=-
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in v*) ;; *) echo "Tag must start with v, got: $RELEASE_TAG" >&2; exit 1;; esac
          gh release create "$RELEASE_TAG" installers/* --repo "$GITHUB_REPOSITORY" --draft --title "OpenApplyr ${RELEASE_TAG#v}" --notes ""
